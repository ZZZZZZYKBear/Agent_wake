<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Ping Global</title>
<style>
	html, body {
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 0;
		overflow: hidden;
		background: transparent;
	}
	body {
		-webkit-app-region: no-drag;
		user-select: none;
	}
</style>
</head>
<body>
<script>
window.__ModuleLoader__ = {
	load(entry) {
		window.__agentPingModule = entry.factory(function require(name) {
			throw new Error("global overlay has no module: " + name);
		});
	}
};
</script>
<script src="./agent-ping-client.js"></script>
<script src="./overlay.js"></script>
</body>
</html>
